@if (open) {
  <div
    class="viewer"
    role="dialog"
    aria-modal="true"
    aria-label="Gallery"
    data-backdrop="true"
    (click)="onBackdropClick($event)"
  >
    <button
      class="viewer__close"
      type="button"
      aria-label="Close gallery"
      (click)="close()"
    >
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>

    <button
      class="viewer__nav viewer__nav--prev"
      type="button"
      aria-label="Previous photo"
      (click)="prev()"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M15 5L8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <figure class="viewer__stage">
      @if (current(); as photo) {
        @for (p of [photo]; track p.file) {
          <img
            [src]="'/gallery/' + p.file"
            [alt]="p.alt"
            (click)="onImageClick($event)"
            decoding="async"
            fetchpriority="high"
          />
        }
      }
    </figure>

    <button
      class="viewer__nav viewer__nav--next"
      type="button"
      aria-label="Next photo"
      (click)="next()"
    >
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="viewer__counter" aria-live="polite">{{ counter() }}</div>
  </div>
}
